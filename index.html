<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Shubham Kumar — software engineer building databases, distributed systems, and reliable infrastructure. Previously principal engineer at LimeChat; open to new roles." />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fafaf8" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#121211" />
    <title>Software engineer — Shubham Kumar</title>
    <script>
      // Set the theme before first paint: a saved choice wins, otherwise follow the system.
      (function () {
        var saved = null;
        try { saved = localStorage.getItem("shubh-theme"); } catch (error) {}
        var dark = matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.dataset.theme = saved || (dark ? "dark" : "light");
      })();
    </script>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 fill=%22%23121211%22/><text x=%2250%22 y=%2272%22 text-anchor=%22middle%22 font-family=%22monospace%22 font-size=%2264%22 fill=%22%23f08a5a%22>$</text></svg>" />
